name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # CI 无法提供真实模型密钥:显式允许匿名访问 + 测试用替身 embedding。
      # 生产代码里没有任何假模型分支,替身只在 tests/conftest.py 中注入。
      ALLOW_UNAUTHENTICATED: "true"
      VECTOR_STORE: "memory"
      DATABASE_URL: "sqlite:///./data/ci.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app scripts dashboard --select E,F,W --ignore E501 --exit-zero

      - name: Prepare data dir
        run: mkdir -p data

      - name: Unit & integration tests
        run: pytest -m "not e2e" -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smart-agent-platform:ci .
